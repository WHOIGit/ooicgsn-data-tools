name: anchor_survey · Tests & Lint

on:
  push:
    branches: [main]
    paths:
      - "anchor_survey/**"
      - ".github/workflows/test_anchor_survey.yml"
  pull_request:
    branches: [main]
    paths:
      - "anchor_survey/**"
      - ".github/workflows/test_anchor_survey.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: cruise-tools
          auto-update-conda: true
          channels: conda-forge,defaults
          use-mamba: true

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y pandas numpy matplotlib
          pip install panel>=1.4.0 pytest flake8
          pip install -e anchor_survey/

      - name: Verify install
        shell: bash -l {0}
        run: |
          python -c "from cruise_tools.anchor_survey.survey.survey import calculate_anchor_position; print('Import OK')"

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest anchor_survey/

      - name: Lint
        shell: bash -l {0}
        run: |
          flake8 anchor_survey/cruise_tools/ --max-line-length=100 --extend-ignore=E203
