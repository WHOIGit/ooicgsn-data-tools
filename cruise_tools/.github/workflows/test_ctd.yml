name: ctd · Tests & Lint

on:
  push:
    branches: [main]
    paths:
      - "ctd/**"
      - ".github/workflows/test_ctd.yml"
  pull_request:
    branches: [main]
    paths:
      - "ctd/**"
      - ".github/workflows/test_ctd.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install package
        run: |
          pip install pytest flake8
          pip install -e ctd/

      - name: Verify install
        run: |
          python -c "from cruise_tools.ctd import XMLCONParser; print('Import OK')"

      - name: Run tests
        run: |
          pytest ctd/

      - name: Lint
        run: |
          flake8 ctd/cruise_tools/ --max-line-length=100 --extend-ignore=E203
