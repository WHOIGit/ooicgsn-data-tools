[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cruise-tools-common"
version = "0.1.0"
description = "Shared utilities for cruise_tools sub-packages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3" }
authors = [
    { name = "Andrew Reed" },
]
keywords = ["oceanography", "cruise", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/WHOIGit/cruise_tools"

[tool.setuptools.packages.find]
where = ["."]
include = ["cruise_tools*"]
